# this_file: Cargo.toml
[workspace]
resolver = "2"
members = ["typftth", "typftth-wasm", "typftth-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/fontlaborg/typftth"
authors = ["Fontlab Ltd. <support@fontlab.com>"]

[workspace.dependencies]
read-fonts = "0.36"
skrifa = "0.39"
thiserror = "2.0"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
